name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml
      - name: Cross-compile
        run: cargo build --release --manifest-path core/Cargo.toml --target aarch64-linux-android

  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;30.0.3" "ndk;27.0.12077973"
      - name: Build
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-apk
          path: sotto.apk
